name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build

      - name: Run :core tests
        run: ./gradlew :core:test

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/'

      # Every successful run uploads the jar so playtesters can grab a build
      # from any branch without a local JDK/Gradle toolchain (docs/PLAYTESTING.md).
      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: pcmc_territory-jar
          path: mod/build/libs/*.jar
          retention-days: 14

      - name: Locate mod jar
        if: startsWith(github.ref, 'refs/tags/v')
        id: jar
        run: |
          jar_path=$(find mod/build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' | head -n1)
          echo "path=$jar_path" >> "$GITHUB_OUTPUT"

      - name: Print jar sha1
        if: startsWith(github.ref, 'refs/tags/v')
        run: sha1sum "${{ steps.jar.outputs.path }}"

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.jar.outputs.path }}
          generate_release_notes: true
